<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - doomgeneric WebAssembly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <!-- Updated logo path to use local static resource -->
        <img src="doom-logo.png" alt="DOOM" class="doom-logo">
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading DOOM WebAssembly...</p>
            <p id="progress">Initializing...</p>
        </div>

        <div class="game-toolbar">
            <div id="status">
                <p id="statusText">Ready to play</p>
            </div>
            <button id="fullscreenButton" class="fullscreen-button" type="button" aria-pressed="false">
                Full screen
            </button>
        </div>

        <div id="gameFrame" class="game-frame">
            <canvas id="canvas" tabindex="-1"></canvas>
        </div>

        <div class="controls-info">
            <h3>Controls</h3>
            <div class="control-row">
                <span class="key">↑</span> <span class="key">W</span> Move Forward
            </div>
            <div class="control-row">
                <span class="key">↓</span> <span class="key">S</span> Move Backward
            </div>
            <div class="control-row">
                <span class="key">←</span> <span class="key">→</span> Turn Left/Right
            </div>
            <div class="control-row">
                <span class="key">A</span> <span class="key">D</span> Strafe Left/Right
            </div>
            <div class="control-row">
                <span class="key">Ctrl</span> Fire
            </div>
            <div class="control-row">
                <span class="key">Space</span> Use/Open
            </div>
            <div class="control-row">
                <span class="key">1-7</span> Select Weapon
            </div>
            <div class="control-row">
                <span class="key">ESC</span> Menu
            </div>
            <div class="control-row">
                <span class="key">F</span> Toggle Full Screen
            </div>
        </div>
    </div>

    <script type='text/javascript'>
        document.addEventListener('DOMContentLoaded', function() {
            var canvas = document.getElementById('canvas');
            var container = document.getElementById('container');
            var gameFrame = document.getElementById('gameFrame');
            var fullscreenButton = document.getElementById('fullscreenButton');

            function isFullscreen() {
                return Boolean(document.fullscreenElement || document.webkitFullscreenElement) ||
                    container.classList.contains('app-fullscreen');
            }

            function updateFullscreenButton() {
                var active = isFullscreen();
                fullscreenButton.textContent = active ? 'Exit full screen' : 'Full screen';
                fullscreenButton.setAttribute('aria-pressed', active ? 'true' : 'false');
            }

            function enterAppFullscreenFallback() {
                container.classList.add('app-fullscreen');
                document.body.classList.add('fullscreen-active');
                updateFullscreenButton();
                canvas.focus();
            }

            function exitAppFullscreenFallback() {
                container.classList.remove('app-fullscreen');
                document.body.classList.remove('fullscreen-active');
                updateFullscreenButton();
            }

            function enterFullscreen() {
                var requestFullscreen = gameFrame.requestFullscreen ||
                    gameFrame.webkitRequestFullscreen ||
                    gameFrame.msRequestFullscreen;

                if (requestFullscreen) {
                    try {
                        var result = requestFullscreen.call(gameFrame);
                        if (result && result.catch) {
                            result.catch(enterAppFullscreenFallback);
                        }
                    } catch (error) {
                        enterAppFullscreenFallback();
                    }
                } else {
                    enterAppFullscreenFallback();
                }

                canvas.focus();
            }

            function exitFullscreen() {
                var exit = document.exitFullscreen ||
                    document.webkitExitFullscreen ||
                    document.msExitFullscreen;

                if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) {
                    exit.call(document);
                }

                exitAppFullscreenFallback();
                canvas.focus();
            }

            function toggleFullscreen() {
                if (isFullscreen()) {
                    exitFullscreen();
                } else {
                    enterFullscreen();
                }
            }

            fullscreenButton.addEventListener('click', toggleFullscreen);

            function handleFullscreenChange() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    document.body.classList.remove('fullscreen-active');
                } else {
                    document.body.classList.add('fullscreen-active');
                    container.classList.remove('app-fullscreen');
                    canvas.focus();
                }

                updateFullscreenButton();
            }

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

            canvas.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });

            document.addEventListener('keydown', function(event) {
                if (event.code === 'KeyF') {
                    event.preventDefault();
                    toggleFullscreen();
                    return;
                }

                var keyMap = {
                    'KeyW': 'ArrowUp',
                    'KeyS': 'ArrowDown',
                    'KeyA': 'ArrowLeft',
                    'KeyD': 'ArrowRight'
                };
                
                if (keyMap[event.code]) {
                    event.preventDefault();
                    var mappedEvent = new KeyboardEvent('keydown', {
                        key: keyMap[event.code],
                        code: keyMap[event.code],
                        keyCode: {
                            'ArrowUp': 38,
                            'ArrowDown': 40,
                            'ArrowLeft': 37,
                            'ArrowRight': 39
                        }[keyMap[event.code]],
                        bubbles: true,
                        cancelable: true
                    });
                    canvas.dispatchEvent(mappedEvent);
                }
            });

            document.addEventListener('keyup', function(event) {
                var keyMap = {
                    'KeyW': 'ArrowUp',
                    'KeyS': 'ArrowDown',
                    'KeyA': 'ArrowLeft',
                    'KeyD': 'ArrowRight'
                };
                
                if (keyMap[event.code]) {
                    event.preventDefault();
                    var mappedEvent = new KeyboardEvent('keyup', {
                        key: keyMap[event.code],
                        code: keyMap[event.code],
                        keyCode: {
                            'ArrowUp': 38,
                            'ArrowDown': 40,
                            'ArrowLeft': 37,
                            'ArrowRight': 39
                        }[keyMap[event.code]],
                        bubbles: true,
                        cancelable: true
                    });
                    canvas.dispatchEvent(mappedEvent);
                }
            });
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)$$(\d+(\.\d+)?)\/(\d+)$$/);
                var now = Date.now();
                var progressElement = document.getElementById('progress');
                var loadingElement = document.getElementById('loading');
                var statusElement = document.getElementById('status');
                
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                
                if (m) {
                    text = m[1];
                    progressElement.textContent = text + ' (' + m[2] + '/' + m[4] + ')';
                } else {
                    progressElement.textContent = text;
                }
                
                if (text === '') {
                    loadingElement.className = 'hidden';
                    statusElement.className = 'visible';
                    document.getElementById('statusText').textContent = 'Game loaded! Click on the canvas to start playing.';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) console.error('[post-exception status] ' + text);
            };
        };
    </script>
    <script async type="text/javascript" src="doomgeneric.js"></script>
</body>
</html>
